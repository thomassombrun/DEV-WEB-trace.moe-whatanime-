<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - trace.moe</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {{template "header" .}}

    <main>
        <h1>Bienvenue</h1>
        <p>Page d'accueil en construction.</p>
        {{if .Error}}
        <p class="error">{{.Error}}</p>
    {{else}}
        <p>Recherches utilisées : {{.Quota.QuotaUsed}} / {{.Quota.Quota}}</p>
    {{end}}
    </main>

    {{template "footer" .}}
</body>
</html>
