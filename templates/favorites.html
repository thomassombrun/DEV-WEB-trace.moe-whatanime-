<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoris - trace.moe</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {{template "header" .}}

    <main>
        <h1>Favoris</h1>
        {{if .}}
        <ul>
            {{range .}}
            <li>
                {{.Title}}
                <form action="/favorites/delete" method="post" style="display: inline;">
                    <input type="hidden" name="anilist_id" value="{{.AniListID}}">
                    <button type="submit" aria-label="Retirer {{.Title}} des favoris">Retirer</button>
                </form>
            </li>
            {{end}}
        </ul>
        {{else}}
        <p>Aucun anime en favoris.</p>
        {{end}}
    </main>

    {{template "footer" .}}
</body>
</html>
